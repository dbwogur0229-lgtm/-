<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>러니버스 - 로그인</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>🏃‍♂️ 러니버스</h1>
                <p>함께 달리는 즐거운 러닝 앱</p>
            </div>
            
            <form class="login-form">
                <div class="input-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" placeholder="이메일을 입력하세요" required>
                </div>
                
                <div class="input-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">로그인</button>
            </form>
            
            <div class="social-login">
                <p>또는</p>
                <button class="btn btn-social" id="googleLogin">
                    <span>🔍</span> Google로 로그인
                </button>
                <button class="btn btn-social" id="kakaoLogin">
                    <span>💬</span> 카카오로 로그인
                </button>
            </div>
            
            <div class="signup-link">
                <p>계정이 없으신가요? <a href="#" id="signupLink">회원가입</a></p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
